[package]
name = "gtkshutdown"
description = "A graceful shutdown utility for Wayland compositors"
repository = "https://github.com/dastarruer/gtkshutdown"
license = "BSD-3-Clause"
version = "0.1.3"
edition = "2024"
authors = ["dastarruer"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
flexi_logger = "0.31.9"
gtk4 = "0.10.3"
log = "0.4.30"
nix = { version = "0.31.3", features = ["signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
swayipc = "4.0.0"
sysinfo = "0.39.6"

[dev-dependencies]
pretty_assertions = "1.4.1"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
